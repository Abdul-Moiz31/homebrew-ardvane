name: update

# Keeps Formula/ardvane.rb on the latest Ardvane release. Every few hours (and on demand) it checks for a new release,
# updates the url and sha256, installs the formula on a real Mac to make sure it works, and only then commits it.
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write          # commit the updated formula to this repository; nothing else

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Point the formula at the latest release
        id: update
        run: echo "tag=$(python3 .github/scripts/update_formula.py)" >> "$GITHUB_OUTPUT"
      - name: Install it on this Mac and run it
        if: steps.update.outputs.tag != ''
        run: |
          brew tap abdul-moiz31/ardvane "$GITHUB_WORKSPACE"
          brew install abdul-moiz31/ardvane/ardvane
          ardvane --version
          brew test abdul-moiz31/ardvane/ardvane
      - name: Commit the new version
        if: steps.update.outputs.tag != ''
        env:
          TAG: ${{ steps.update.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ardvane ${TAG#v}"
          git push
